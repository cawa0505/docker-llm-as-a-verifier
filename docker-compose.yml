services:
  verifier:
    build: .
    container_name: llm-verifier
    ports:
      - "${VERIFIER_PORT:-8010}:8010"
    environment:
      # Compose loads .env for interpolation when it exists; empty defaults
      # keep a clean clone runnable so the entrypoint can report the problem.
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MODEL_ALIAS=${MODEL_ALIAS:-qwen3.5-9b}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-EMPTY}
      - VERIFIER_PORT=${VERIFIER_PORT:-8010}
      - VERIFIER_MIN_SCORE=${VERIFIER_MIN_SCORE:-0.8}
    volumes:
      # Score cache persists across restarts
      - verifier-cache:/app/cache
      # Results directory
      - verifier-results:/app/results
    restart: unless-stopped

volumes:
  verifier-cache:
  verifier-results: